<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Serviço — Calculadora Azure</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <!-- Claro é o padrão, exceto se o usuário escolheu escuro explicitamente -->
  <script>(function(){if(localStorage.getItem('finops-theme')!=='dark')document.documentElement.setAttribute('data-theme','light');})()</script>
  <style>
    /* ── Reset / base ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', 'Segoe UI', sans-serif; }

    /* ── Header do portal ──────────────────────────────────── */
    .portal-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(18,2,32,.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 56px;
    }
    .portal-brand {
      display: flex; align-items: center; gap: 12px;
    }
    .portal-brand svg { flex-shrink: 0; }
    .portal-brand-name {
      font-size: 18px; font-weight: 800; letter-spacing: .04em;
      background: linear-gradient(90deg, #c084fc, #9333ea);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .portal-brand-sub {
      font-size: 11px; color: var(--text-muted); letter-spacing: .06em;
      text-transform: uppercase; margin-top: 1px;
    }
    .portal-badge {
      font-size: 10px; background: rgba(147,51,234,.18);
      border: 1px solid rgba(147,51,234,.4); border-radius: 20px;
      padding: 2px 10px; color: var(--accent); font-weight: 600;
      letter-spacing: .06em;
    }
    .portal-user-badge {
      display: flex; align-items: center; gap: 8px;
      background: rgba(34,197,94,.10); border: 1px solid rgba(34,197,94,.3);
      border-radius: 8px; padding: 6px 14px;
      font-size: 12px; color: #22c55e; font-weight: 600;
    }
    .portal-user-badge .pub-nome {
      color: #22c55e; font-weight: 700;
    }
    .portal-user-badge .pub-email {
      color: rgba(34,197,94,.75); font-weight: 400; font-size: 11px;
    }
    .portal-user-badge .pub-sair {
      background: none; border: none; cursor: pointer;
      color: rgba(34,197,94,.55); font-size: 14px; padding: 0 0 0 4px;
      line-height: 1;
    }
    .portal-user-badge .pub-sair:hover { color: #22c55e; }

    /* ── Modal de identificação ────────────────────────────── */
    @keyframes ident-rotate { from { transform:translate(-50%,-50%) rotate(0deg); } to { transform:translate(-50%,-50%) rotate(360deg); } }
    @keyframes ident-pulse  { 0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1);} 50%{opacity:.80;transform:translate(-50%,-50%) scale(1.08);} }
    @keyframes ident-float  { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }
    @keyframes ident-logo-glow {
      0%,100% { filter: drop-shadow(0 0 3px rgba(147,51,234,.6)); }
      50%      { filter: drop-shadow(0 0 6px rgba(147,51,234,1)) drop-shadow(0 0 12px rgba(147,51,234,.35)); }
    }
    .ident-vivo-text    { animation: ident-logo-glow 3s ease-in-out infinite; }
    .ident-vivo-mascote { animation: ident-logo-glow 3s ease-in-out infinite; }

    #modal-ident {
      position: fixed; inset: 0; z-index: 200;
      background: #0c0014;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    /* Núcleo roxo central */
    #modal-ident::before {
      content: '';
      position: absolute; left: 50%; top: 46%;
      width: 480px; height: 480px;
      transform: translate(-50%,-50%);
      background: radial-gradient(ellipse at center,
        rgba(147,51,234,.55) 0%, rgba(109,40,217,.32) 25%,
        rgba(76,29,149,.15) 55%, transparent 75%);
      animation: ident-pulse 4s ease-in-out infinite;
      pointer-events: none;
    }
    /* Disco de raios girando */
    #modal-ident::after {
      content: '';
      position: absolute; left: 50%; top: 46%;
      width: 860px; height: 860px;
      transform: translate(-50%,-50%) rotate(0deg);
      background: repeating-conic-gradient(
        from 0deg, rgba(147,51,234,.18) 0deg 1.5deg, transparent 1.5deg 9deg);
      border-radius: 50%;
      animation: ident-rotate 18s linear infinite;
      pointer-events: none;
    }
    .ident-rays {
      position: absolute; left: 50%; top: 46%;
      width: 1100px; height: 1100px;
      transform: translate(-50%,-50%) rotate(0deg);
      background: repeating-conic-gradient(
        from 0deg, rgba(124,58,237,.10) 0deg .7deg, transparent .7deg 6deg);
      border-radius: 50%;
      animation: ident-rotate 9s linear infinite reverse;
      pointer-events: none;
    }
    .ident-glow {
      position: absolute; left: 50%; top: 46%;
      width: 300px; height: 300px;
      transform: translate(-50%,-50%);
      background: radial-gradient(ellipse at center, rgba(147,51,234,.32) 0%, transparent 70%);
      animation: ident-pulse 3s ease-in-out infinite .8s;
      pointer-events: none;
    }
    .ident-card {
      background: rgba(18,2,32,.82); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(147,51,234,.35);
      border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 400px;
      box-shadow: 0 0 60px rgba(147,51,234,.20), 0 24px 64px rgba(0,0,0,.6);
      position: relative; z-index: 2;
      animation: ident-float 6s ease-in-out infinite;
      display: flex; flex-direction: column; align-items: center;
    }
    .ident-logo {
      display: flex; justify-content: center; margin-bottom: 14px;
    }
    /* O cartão de identificação é escuro nos DOIS temas: sempre o logo da variante escura
       (o padrão por tema deixaria o wordmark roxo escuro apagado sobre o vidro escuro). */
    .ident-logo .topbar-logo-light { display: none !important; }
    .ident-logo .topbar-logo-dark  { display: block !important; }
    .ident-card h2 {
      font-size: 18px; font-weight: 700; color: #f5f0ff; margin-bottom: 4px; text-align: center;
    }
    .ident-card p {
      font-size: 12px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; text-align: center;
    }
    .ident-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; width: 100%; }
    .ident-field label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .ident-field input {
      background: rgba(0,0,0,.35); border: 1px solid var(--border-light);
      color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 14px;
      outline: none; transition: border-color .2s; width: 100%;
    }
    .ident-field input:focus { border-color: var(--accent); }
    #ident-erro { font-size: 12px; color: var(--danger); min-height: 18px; margin-bottom: 10px; }
    .ident-btn {
      width: 100%; padding: 11px; font-size: 14px; font-weight: 700;
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      cursor: pointer; transition: opacity .2s;
    }
    .ident-btn:hover { opacity: .85; }
    .ident-btn:disabled { opacity: .5; cursor: default; }

    /* ── Hero (front add) ──────────────────────────────────── */
    .portal-hero {
      padding: 40px 24px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: radial-gradient(ellipse at 50% 0%, rgba(147,51,234,.12) 0%, transparent 70%);
    }
    .portal-hero h1 {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 800;
      background: linear-gradient(90deg, #c084fc 0%, #9333ea 50%, #7c3aed 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(147,51,234,.4));
      margin-bottom: 10px;
    }
    .portal-hero p {
      font-size: 14px; color: var(--text-muted); max-width: 560px; margin: 0 auto 20px;
      line-height: 1.6;
    }
    .portal-hero-chips {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    }
    .portal-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(147,51,234,.1); border: 1px solid rgba(147,51,234,.3);
      border-radius: 20px; padding: 4px 12px;
      font-size: 11px; color: var(--text-dim); letter-spacing: .04em;
    }

    /* ── Página inicial "Portal de Serviços" ───────────────────── */
    @keyframes portal-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .portal-hero-home { position: relative; overflow: hidden; padding: 60px 24px 48px; }
    .portal-hero-inner { position: relative; z-index: 1; }
    .portal-rays {
      position: absolute; left: 50%; top: 30%; width: 1200px; height: 1200px;
      transform: translate(-50%,-50%);
      background: repeating-conic-gradient(from 0deg, rgba(124,58,237,.12) 0deg .7deg, transparent .7deg 6deg);
      border-radius: 50%; pointer-events: none;
      -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 62%);
              mask-image: radial-gradient(circle, #000 12%, transparent 62%);
      animation: ident-rotate 90s linear infinite;
    }
    .portal-glow {
      position: absolute; left: 50%; top: 40%; width: 560px; height: 280px;
      transform: translate(-50%,-50%); pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(147,51,234,.30) 0%, transparent 70%);
    }
    .portal-eyebrow {
      display: inline-block; margin-bottom: 14px; padding: 4px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      color: var(--accent); background: rgba(147,51,234,.12); border: 1px solid rgba(147,51,234,.32);
    }
    .portal-home { max-width: 1000px; margin: 0 auto; padding: 32px 16px 24px; }
    .portal-home-grid {
      display: grid; gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
    }
    .portal-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
      padding: 26px; text-decoration: none; color: var(--text); border-radius: 18px;
      border: 1px solid transparent;
      background:
        linear-gradient(#0b0114, #0b0114) padding-box,
        linear-gradient(135deg, rgba(168,85,247,.55), rgba(147,51,234,.08) 55%, rgba(124,58,237,.35)) border-box;
      animation: portal-rise .55s ease both;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .portal-card:hover { transform: translateY(-4px); box-shadow: 0 14px 40px rgba(147,51,234,.28); }
    .portal-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .portal-card-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .portal-card-icon {
      display: flex; align-items: center; justify-content: center; width: 64px; height: 64px;
      border-radius: 18px; color: #c084fc;
      background: linear-gradient(135deg, rgba(147,51,234,.32), rgba(124,58,237,.10));
      border: 1px solid rgba(147,51,234,.35);
    }
    .portal-card-tag {
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--accent); background: rgba(147,51,234,.12);
    }
    .portal-card-title { font-size: 20px; font-weight: 800; }
    .portal-card-desc { font-size: 13px; line-height: 1.6; color: var(--text-muted); }
    .portal-card-cta { margin-top: auto; padding-top: 8px; font-size: 14px; font-weight: 700; color: var(--accent); }
    .portal-card-arrow { display: inline-block; transition: transform .2s ease; }
    .portal-card:hover .portal-card-arrow { transform: translateX(5px); }

    /* Como funciona */
    .portal-steps { max-width: 1000px; margin: 0 auto; padding: 16px 16px 40px; }
    .portal-steps h2 {
      margin-bottom: 18px; text-align: center; font-size: 13px; font-weight: 700;
      letter-spacing: .16em; text-transform: uppercase; color: var(--text-muted);
    }
    .portal-steps-list {
      list-style: none; margin: 0; padding: 0; display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
    }
    .portal-step { display: flex; flex-direction: column; gap: 6px; padding: 16px; border: 1px dashed rgba(147,51,234,.28); border-radius: 12px; }
    .portal-step-n {
      display: flex; align-items: center; justify-content: center; width: 28px; height: 28px;
      border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; font-weight: 800;
    }
    .portal-step-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .portal-step-text { font-size: 12px; line-height: 1.55; color: var(--text-muted); }

    /* Trilha "← Portal de Serviços / serviço" e rodapé */
    .portal-crumbs {
      max-width: 1400px; margin: 0 auto; padding: 14px 16px 0;
      display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted);
    }
    .portal-crumbs a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .portal-crumbs a:hover { text-decoration: underline; }
    .portal-crumbs [aria-current] { color: var(--text); font-weight: 600; }
    .portal-footer {
      max-width: 1000px; margin: 0 auto; padding: 20px 16px 36px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 16px;
      font-size: 12px; color: var(--text-muted);
    }
    .portal-footer a { color: var(--accent); text-decoration: none; }
    .portal-footer a:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) {
      .portal-rays, .portal-card { animation: none; }
      .portal-card, .portal-card-arrow { transition: none; }
      .portal-card:hover { transform: none; }
    }
    @media (pointer: coarse) {
      .portal-nav-btn { min-width: 44px; min-height: 44px; }
      .portal-theme-btn, #portal-help-btn { min-height: 44px !important; }
    }
    @media (max-width: 480px) {
      .portal-hero-home { padding: 40px 16px 32px; }
      .portal-card { padding: 20px; }
      .portal-card-icon { width: 54px; height: 54px; }
    }
    .portal-brand.clicavel { cursor: pointer; }
    /* Telas estreitas: o cabeçalho quebra em duas linhas em vez de estourar a largura */
    @media (max-width: 640px) {
      .portal-header { height: auto; flex-wrap: wrap; row-gap: 6px; padding: 8px 12px; }
      .portal-header-actions { flex-wrap: wrap; justify-content: flex-end; gap: 6px !important; margin-left: auto; }
      .portal-brand-name { font-size: 15px; }
      .portal-badge { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .portal-card { transition: none; }
      .portal-card:hover { transform: none; }
    }
    @media (max-width: 480px) {
      .portal-card { padding: 18px; }
      .portal-card-icon { width: 52px; height: 52px; }
    }

    /* ── Wrapper da calculadora ────────────────────────────── */
    .portal-calc-wrap {
      max-width: 1400px; margin: 0 auto; padding: 0 16px 40px;
    }
    /* Override: no portal o #view-calculadora não usa height:100%/overflow:hidden */
    body.portal-mode #view-calculadora.active {
      height: auto !important;
      overflow: visible !important;
      display: block !important;
    }

    /* Oculta features que precisam de auth no modo público */
    body.portal-mode #cvista-detalhe,
    body.portal-mode #cvista-servico,
    body.portal-mode #cimport-area,
    body.portal-mode .calc-import-btn,
    body.portal-mode [onclick*="abrirImport"],
    body.portal-mode #cdiag-area { display: none !important; }

    /* Spinner de carregamento inicial */
    #portal-loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 300px; gap: 16px; color: var(--text-muted);
    }
    .portal-spinner {
      width: 40px; height: 40px; border: 3px solid rgba(147,51,234,.2);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mensagem de portal inativo */
    #portal-inactive {
      display: none; text-align: center; padding: 60px 24px;
    }
    #portal-inactive .pi-icon { font-size: 48px; margin-bottom: 16px; }
    #portal-inactive h2 { color: var(--text); margin-bottom: 8px; font-size: 20px; }
    #portal-inactive p  { color: var(--text-muted); font-size: 14px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 18px; border-radius: 10px;
      font-size: 13px; font-weight: 500;
      opacity: 0; transform: translateY(8px);
      transition: all 0.2s ease; z-index: 10000; pointer-events: none;
    }
    .toast.show  { opacity: 1; transform: translateY(0); }
    .toast.success { background: var(--accent); color: #fff; }
    .toast.error   { background: #ff4d6a;        color: #fff; }
    .toast.warn    { background: #ff8c42;         color: #fff; }

    /* Botão de tema do portal */
    .portal-theme-btn {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 9px; cursor: pointer; color: var(--text-dim);
      display: flex; align-items: center; height: 32px;
      transition: border-color .15s, color .15s, background .15s;
    }
    .portal-theme-btn:hover { border-color: var(--accent); color: var(--accent); }

    .portal-refresh-fab {
      position: fixed; right: 12px; bottom: 12px; z-index: 500;
      display: flex; align-items: center; gap: 0;
      padding: 3px 6px 3px 4px;
      background: var(--surface, #181825); border: 1px solid var(--border, #313244);
      border-radius: 14px; box-shadow: 0 1px 8px rgba(0,0,0,.3);
      color: var(--text-muted, #6c7086); opacity: .45; transition: opacity .25s;
    }
    .portal-refresh-fab:hover { opacity: .9; }
    .portal-refresh-fab-btn {
      display: flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; padding: 0; flex-shrink: 0;
      border: 0; background: none; color: inherit; cursor: pointer;
      transition: color .15s;
    }
    .portal-refresh-fab-btn:hover { color: var(--accent, #89b4fa); }
    .portal-refresh-fab-btn:disabled { cursor: progress; }
    .portal-refresh-fab-sep {
      width: 1px; height: 11px; margin: 0 4px;
      background: var(--border, #313244); flex-shrink: 0;
    }
    .portal-refresh-fab-select {
      max-width: 40px; padding: 0; border: 0; outline: 0; background: none;
      color: var(--text-muted, #6c7086); font: inherit; font-size: 10px; cursor: pointer;
    }
    .portal-refresh-fab-select option { background: var(--surface, #181825); }
    .portal-refresh-status {
      min-width: 18px; margin-left: 2px; color: var(--accent, #89b4fa);
      font: 9px monospace;
    }
    .portal-refresh-icon.spinning { animation: portal-refresh-spin .7s linear infinite; }
    @keyframes portal-refresh-spin { to { transform: rotate(360deg); } }
    @media (pointer: coarse) {
      .portal-refresh-fab { bottom: 12px; right: 12px; padding: 5px 8px 5px 6px; }
      .portal-refresh-fab-btn { width: 28px; height: 28px; }
      .portal-refresh-fab-select { min-height: 28px; }
    }

    /* Menu do portal (Calculadora | Recursos órfãos) */
    .portal-nav { display: flex; align-items: center; gap: 4px; padding: 2px; border: 1px solid var(--border); border-radius: 10px; }
    .portal-nav-btn {
      text-decoration: none;
      background: none; border: 0; border-radius: 8px; cursor: pointer; color: var(--text-dim);
      display: flex; align-items: center; justify-content: center; width: 34px; height: 28px;
      transition: background .15s, color .15s;
    }
    .portal-nav-btn:hover { color: var(--accent); }
    .portal-nav-btn.active { background: var(--accent); color: #fff; }

    /* ── Tema Claro: overrides portal ── */
    [data-theme="light"] html,
    [data-theme="light"] body { background: #f0f2f5; }

    /* Cabeçalho CLARO no tema claro — mesmo padrão da top-bar do Sistema (styles.css: [data-theme="light"] .top-bar),
       com o logo FinOps colorido padrão (finops-logo.png) em vez da silhueta branca sobre roxo. */
    [data-theme="light"] .portal-header {
      background: rgba(255,255,255,.92);
      border-bottom-color: #e9e3f7;
      box-shadow: 0 1px 8px rgba(76,29,149,.06);
    }
    [data-theme="light"] .portal-brand-name {
      background: none !important;
      -webkit-background-clip: unset !important;
      background-clip: unset !important;
      -webkit-text-fill-color: #4a0080 !important;
      color: #4a0080 !important;
    }
    [data-theme="light"] .portal-brand-sub { color: #6b7280 !important; }
    [data-theme="light"] .portal-badge {
      background: rgba(109,40,217,.08) !important;
      border-color: rgba(109,40,217,.25) !important;
      color: #6d28d9 !important;
    }
    [data-theme="light"] #portal-help-btn,
    [data-theme="light"] .portal-theme-btn {
      border-color: #d8ccf0 !important;
      color: #4b5563 !important;
    }
    [data-theme="light"] #portal-help-btn:hover,
    [data-theme="light"] .portal-theme-btn:hover {
      background: rgba(109,40,217,.08) !important;
      border-color: #7c3aed !important;
      color: #6d28d9 !important;
    }
    [data-theme="light"] .portal-nav { border-color: #d8ccf0 !important; }
    [data-theme="light"] .portal-nav-btn { color: #4b5563 !important; }
    [data-theme="light"] .portal-nav-btn:hover { background: rgba(109,40,217,.08) !important; color: #6d28d9 !important; }
    [data-theme="light"] .portal-nav-btn.active { background: #6d28d9 !important; color: #ffffff !important; }
    [data-theme="light"] .portal-user-badge { background: rgba(21,128,61,.08); border-color: rgba(21,128,61,.28); color: #15803d; }
    [data-theme="light"] .portal-user-badge .pub-nome { color: #15803d; }
