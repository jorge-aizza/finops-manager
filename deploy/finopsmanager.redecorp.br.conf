server {
    listen 80;
    listen [::]:80;
    server_name finopsmanager.redecorp.br;

    return 301 https://$host$request_uri;
}

server {
    listen 10.124.65.182:3000;
    server_name _;

    return 307 https://finopsmanager.redecorp.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name finopsmanager.redecorp.br;

    ssl_certificate /etc/pki/tls/certs/finopsmanager.crt;
    ssl_certificate_key /etc/pki/tls/private/finopsmanager.key;
    ssl_protocols TLSv1.2;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
